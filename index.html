<body>

    <script>
        // Автоматическое обновление даты
        function updateDate() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('update-date').textContent = 
                'Last update: ' + formatter.format(now);
        }
        
        // Обновляем дату при загрузке и каждую минуту
        updateDate();
        setInterval(updateDate, 60000); // Каждую минуту
    </script>
</body>
